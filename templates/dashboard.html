
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Secure Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #edf4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-card {
            background: white;
            width: 480px;
            max-width: 90%;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 50, 120, 0.10);
        }

        .welcome {
            text-align: center;
            margin-bottom: 25px;
        }

        h2 {
            color: #173b70;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }

        h3 {
            color: #173b70;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .user-info {
            background: #f4f7fc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .user-info label {
            display: block;
            color: #718096;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .user-info p {
            margin: 0;
            color: #334155;
            font-size: 15px;
            font-weight: bold;
        }

        .status {
            text-align: center;
            color: #15803d;
            font-size: 14px;
            font-weight: bold;
            margin: 25px 0;
        }

        .logout-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .logout-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="dashboard-card">

        <div class="welcome">
            <h2>Welcome to Your Dashboard!</h2>
            <p class="subtitle">
                You have successfully logged in
                to your secure account.
            </p>
        </div>

        {% if user %}

        <h3>Account Information</h3>

        <div class="user-info">
            <label>Full Name</label>
            <p>{{ user["name"] }}</p>
        </div>

        <div class="user-info">
            <label>Email Address</label>
            <p>{{ user["email"] }}</p>
        </div>

        <p class="status">
            &#10004; Login Successful
        </p>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

        {% endif %}

    </div>

</body>
</html>
